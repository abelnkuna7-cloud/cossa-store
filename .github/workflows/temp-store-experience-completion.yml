name: Temporary Store Experience Completion

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - upgrade/store-experience-completion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded Store UX patch
        run: python3 scripts/apply_store_experience_completion.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee lint-output.txt
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-experience-lint
          path: lint-output.txt
      - name: Stop on lint failure
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - name: Build production bundle
        run: npm run build
      - name: Commit generated patch when needed
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "cossa-store-upgrade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/index.tsx src/components/layout/SiteHeader.tsx
          git commit -m "feat(store): complete customer experience upgrade"
          git push
