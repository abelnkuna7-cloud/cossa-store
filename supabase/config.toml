[functions.printify-fulfilment-create]
# The function verifies the caller session and Cossa admin role itself.
# A separate PRINTIFY_FULFILMENT_ENABLED=true server flag is still required before any order can be submitted.
verify_jwt = false

[functions.printify-fulfilment-mapping]
# The function verifies the caller session and Cossa admin role itself.
# Mapping writes remain blocked unless PRINTIFY_MAPPING_WRITES_ENABLED=true.
verify_jwt = false

[functions.printify-fulfilment-catalogue]
# Read-only browser for the connected Printify shop. The function verifies the caller session and Cossa admin role itself.
verify_jwt = false

[functions.printify-production-readiness]
# Read-only production readiness gate. The function verifies the caller session and Cossa owner/admin role itself.
verify_jwt = false
